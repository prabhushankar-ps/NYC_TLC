name: tlc_monthly_load

on:
  schedule:
    - cron: '17 6 3 * *'      # 06:17 UTC, 3rd of the month
  workflow_dispatch:           # manual trigger — always add this
    inputs:
      month:
        description: 'YYYY-MM to load (blank = auto)'
        required: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install snowflake-connector-python requests

      - name: Download and load
        env:
          SF_ACCOUNT:     ${{ secrets.SF_ACCOUNT }}
          SF_USER:        ${{ secrets.SF_USER }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_WAREHOUSE:   ${{ secrets.SF_WAREHOUSE }}
          TARGET_MONTH:   ${{ inputs.month }}
        run: python scripts/load_tlc.py
