nyc_taxi:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      private_key: "{{ env_var('SF_PRIVATE_KEY') }}"
      role: "{{ env_var('SF_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE', 'LOAD_WH') }}"
      database: NYC_TAXI
      schema: ANALYTICS
      threads: 4
